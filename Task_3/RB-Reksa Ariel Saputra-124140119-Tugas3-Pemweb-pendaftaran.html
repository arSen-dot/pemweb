<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran Panitia Hajatan</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container detail-container">
        <h1 id="page-title">Formulir Pendaftaran Panitia Hajatan</h1>
        <p class="page-sub">Isi data diri untuk mendaftar sebagai panitia hajatan</p>

        <form action="detail.html" method="get">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="cth: Reksa Ariel Saputra" required>
            </div>

            <div class="form-group">
                <label for="nim">NIM</label>
                <input type="text" id="nim" name="nim" placeholder="cth: 124140119" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="cth: nama@student.itera.ac.id" required>
            </div>

            <div class="form-group">
                <span class="form-label">Jenis Kelamin</span>
                <div class="radio-group">
                    <label class="radio"><input type="radio" name="jk" value="Laki-laki" checked> Laki-laki</label>
                    <label class="radio"><input type="radio" name="jk" value="Perempuan"> Perempuan</label>
                </div>
            </div>

            <div class="form-group">
                <label for="prodi">Program Studi</label>
                <select id="prodi" name="prodi">
                    <option value="Teknik Informatika">Teknik Informatika</option>
                    <option value="Teknik Elektro">Teknik Elektro</option>
                    <option value="Teknik Sipil">Teknik Sipil</option>
                    <option value="Teknik Mesin">Teknik Mesin</option>
                </select>
            </div>

            <div class="form-group">
                <label for="kelas">Kelas</label>
                <input type="text" id="kelas" name="kelas" placeholder="cth: RB">
            </div>

            <button type="submit" class="btn-submit">Kirim Pendaftaran</button>
        </form>
    </div>
</body>
</html>
